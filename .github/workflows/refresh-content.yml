name: Refresh dynamic content

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch content
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run fetch:content

      - name: Commit changes if any
        run: |
          if git diff --quiet public/data/content.json; then
            echo "No content changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/content.json
            git commit -m "chore: refresh dynamic content"
            # Retry with rebase if remote moved while we were running
            for i in 1 2 3; do
              if git push origin HEAD:dev; then
                break
              fi
              echo "Push failed, rebasing and retrying ($i/3)…"
              git pull --rebase origin dev
            done
          fi

      - name: Merge dev into main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/dev
          git push origin main
