name: Refresh dynamic content

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Debug — confirm secrets are visible (does not print values)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          echo "IG_ACCESS_TOKEN set? ${IG_ACCESS_TOKEN:+yes}${IG_ACCESS_TOKEN:-NO}"
          echo "IG_ACCESS_TOKEN length: ${#IG_ACCESS_TOKEN}"
          echo "IG_BUSINESS_ACCOUNT_ID set? ${IG_BUSINESS_ACCOUNT_ID:+yes}${IG_BUSINESS_ACCOUNT_ID:-NO}"
          echo "IG_BUSINESS_ACCOUNT_ID length: ${#IG_BUSINESS_ACCOUNT_ID}"

      - name: Fetch content
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: npm run fetch:content

      - name: Commit changes if any
        run: |
          if git diff --quiet public/data/content.json; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/content.json
          git commit -m "chore: refresh dynamic content"
          git push
