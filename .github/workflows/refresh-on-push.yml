name: Refresh content on push

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/content.json"
      - "**/*.md"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch content
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run fetch:content

      - name: Commit changes if any
        run: |
          if git diff --quiet public/data/content.json; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/content.json
          git commit -m "chore: refresh dynamic content [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed, rebasing and retrying ($i/3)…"
            git pull --rebase origin main
          done
          echo "Push failed after 3 retries"
          exit 1
